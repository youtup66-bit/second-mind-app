# نشر التطبيق على GitHub Pages:
#   فرع main  ← النسخة الحقيقية (الرابط الأساسي)
#   فرع dev   ← نسخة التجربة تحت ‎/dev/‎ (معزولة: بياناتها ومخازنها ومشروع Firebase الخاص بها)
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/checkout@v4
        with: { ref: dev, path: devsrc }
        continue-on-error: true
      - name: Assemble live + dev
        run: |
          rm -rf site/.git site/.github
          if [ -f devsrc/index.html ]; then
            rm -rf devsrc/.git devsrc/.github
            mkdir -p site/dev
            cp -r devsrc/. site/dev/
            # اسم مختلف لنسخة التجربة عند تثبيتها على الهاتف
            sed -i 's/"name": *"[^"]*"/"name": "عقلي الثاني (تجربة)"/; s/"short_name": *"[^"]*"/"short_name": "تجربة"/' site/dev/manifest.webmanifest
            # ملف التحديث داخل تطبيق الأندرويد: الإصدار وكل ملف مع بصمته (SHA-256)
            python3 - <<'PYEOF'
          import json, hashlib, os, re
          root = 'site/dev'
          ver = re.search(r'const VERSION = (\d+)', open(f'{root}/sw.js', encoding='utf-8').read()).group(1)
          files = []
          for d, _, names in os.walk(root):
              for name in names:
                  rel = os.path.relpath(os.path.join(d, name), root).replace(os.sep, '/')
                  if rel == 'update.json':
                      continue
                  files.append({'path': rel, 'sha256': hashlib.sha256(open(os.path.join(d, name), 'rb').read()).hexdigest()})
          json.dump({'version': ver, 'files': files}, open(f'{root}/update.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('update.json version', ver, 'files', len(files))
          PYEOF
          fi
          # ملف التحديث للموقع الرئيسي (main): ملفات الواجهة فقط
          python3 - <<'PYEOF'
          import json, hashlib, os, re
          root = 'site'
          ver = re.search(r'const VERSION = (\d+)', open(f'{root}/sw.js', encoding='utf-8').read()).group(1)
          rels = ['index.html', 'sw.js', 'manifest.webmanifest']
          for folder in ['css', 'js', 'icons']:
              for d, _, names in os.walk(os.path.join(root, folder)):
                  for name in names:
                      rels.append(os.path.relpath(os.path.join(d, name), root).replace(os.sep, '/'))
          out = [{'path': rel, 'sha256': hashlib.sha256(open(os.path.join(root, rel), 'rb').read()).hexdigest()} for rel in rels]
          json.dump({'version': ver, 'files': out}, open(f'{root}/update.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('root update.json version', ver, 'files', len(out))
          PYEOF
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
