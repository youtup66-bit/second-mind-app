<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a14">
  <meta name="description" content="عقلي الثاني: مساعد ذكي يسجّل أفكارك وينظّمها">
  <title>عقلي الثاني</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عقلي الثاني">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* شاشة الافتتاح: لمحة بالثيم الأخضر (الخلفية والكرة المتوهجة) ثم تختفي */
    #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 60% at 50% 0%, #0f3d2c 0%, #071a14 45%, #04100c 100%); transition: opacity .35s ease; }
    #boot-splash.is-gone { opacity: 0; pointer-events: none; }
    #boot-splash .boot-orb { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #e6fff3 0%, #4ade80 20%, #16a34a 58%, #063b28 100%); box-shadow: 0 0 60px 14px rgba(74,222,128,.42); animation: boot-breathe 1.2s ease-in-out infinite; }
    @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true"><div class="boot-orb"></div></div>
  <header class="topbar">
    <h1 class="topbar__title" id="screen-title">عقلي الثاني</h1>
  </header>

  <main id="app" class="screen" aria-live="polite"></main>

  <nav class="tabbar" aria-label="التنقل">
    <a href="#/home" class="tabbar__item" data-route="home">
      <span class="tabbar__icon" aria-hidden="true">💬</span><span>المحادثة</span>
    </a>
    <a href="#/chats" class="tabbar__item" data-route="chats" hidden>
      <span class="tabbar__icon" aria-hidden="true">🗨️<span class="tabbar__badge" hidden></span></span><span>المحادثات</span>
    </a>
    <a href="#/tasks" class="tabbar__item" data-route="tasks" hidden>
      <span class="tabbar__icon" aria-hidden="true">📌<span class="tabbar__badge" hidden></span></span><span>المهام</span>
    </a>
    <a href="#/staff" class="tabbar__item" data-route="staff" hidden>
      <span class="tabbar__icon" aria-hidden="true">🧑‍💼</span><span>المنتسبين</span>
    </a>
    <a href="#/settings" class="tabbar__item" data-route="settings">
      <span class="tabbar__icon" aria-hidden="true">⚙</span><span>الإعدادات</span>
    </a>
  </nav>

  <div class="boot-fail" id="boot-fail" hidden>
    <p>تعذّر تحميل التطبيق كاملاً. ربما وصل جزء من تحديث جديد قبل غيره.</p>
    <button class="btn" id="boot-reload">إعادة التحميل</button>
    <p class="muted" id="boot-err"></p>
  </div>
  <script>
    // فحص الإقلاع: إن لم يبدأ التطبيق خلال ٦ ثوانٍ نعرض زر إعادة تحميل نظيفة (بياناتك لا تُمس)
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) { errs.push(e.message || String(e)); }, true);
      setTimeout(function () {
        if (window.__appReady) return;
        document.getElementById('boot-err').textContent = errs.slice(-2).join(' | ');
        document.getElementById('boot-fail').hidden = false;
      }, 6000);
      document.getElementById('boot-reload').onclick = function () {
        // نمسح نسخ واجهة التطبيق فقط (second-mind-v…)، ونُبقي النماذج والأصوات المنزّلة،
        // ولا نلغي عامل الخدمة حتى لا يُلغى أي تنزيل جارٍ في الخلفية
        var done = function () { location.reload(); };
        var clearShell = window.caches ? caches.keys().then(function (k) {
          var pre = /\/dev\//.test(location.pathname) ? 'second-mind-dev' : 'second-mind';
          return Promise.all(k.filter(function (n) { return new RegExp('^' + pre + '-v\\d+$').test(n); }).map(function (n) { return caches.delete(n); }));
        }) : Promise.resolve();
        var update = navigator.serviceWorker ? navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }) : 0;
        Promise.all([clearShell, update]).then(done, done);
      };
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
